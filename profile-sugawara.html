<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菅原さん - プロフィールカード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 380px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .card-wrapper {
            position: relative;
            height: 420px;
            perspective: 1000px;
            user-select: none;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: grab;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100px);
        }

        .card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .card.prev {
            transform: translateX(-100px);
        }

        .card-1 {
            background-color: #FFF3CD;
        }

        .card-1 .card-title {
            color: #85500B;
        }

        .card-1 .card-answer {
            color: #533F0B;
        }

        .card-2 {
            background-color: #D1E7F4;
        }

        .card-2 .card-title {
            color: #0C447C;
        }

        .card-2 .card-answer {
            color: #185FA5;
        }

        .card-3 {
            background-color: #F9E5F0;
        }

        .card-3 .card-title {
            color: #72243E;
        }

        .card-3 .card-answer {
            color: #993556;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .card-answer {
            font-size: 15px;
            line-height: 1.6;
        }

        .indicators {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dot.active {
            background-color: white;
        }

        .nav-hint {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-box {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #333;
            text-align: center;
            line-height: 1.6;
        }

        .info-box code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>菅原さん</h2>
            <p id="card-counter">1 / 3</p>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <div class="card card-1 active">
                <h3 class="card-title">社会人になって一番「大人になったな」と思った瞬間は？</h3>
                <p class="card-answer">毎月の経費をExcelで説明できるようになったとき。食べログの複雑さがやっと理解できた。</p>
            </div>

            <div class="card card-2">
                <h3 class="card-title">もし明日から1ヵ月急に休みになったら何をする？</h3>
                <p class="card-answer">登米に帰って、飲食店の下見ツアー。いつかの店のために食べ歩き&リサーチ三昧。</p>
            </div>

            <div class="card card-3">
                <h3 class="card-title">自分を料理・食べ物に例えるなら何？</h3>
                <p class="card-answer">ラーメンのスープ。奥深くて、一度ハマると脱出不可。毎日新しい味わいが発見できる。</p>
            </div>
        </div>

        <div class="indicators">
            <div class="dot active" data-index="0"></div>
            <div class="dot" data-index="1"></div>
            <div class="dot" data-index="2"></div>
        </div>

        <div class="nav-hint">← スワイプで進む →</div>

        <div class="info-box">
            このページの URL を QR コード化すれば、懇親会で配布できます。
        </div>
    </div>

    <script>
        let currentCard = 0;
        let startX = 0;
        let isDragging = false;

        const cards = document.querySelectorAll('.card');
        const dots = document.querySelectorAll('.dot');
        const wrapper = document.getElementById('cardWrapper');
        const counter = document.getElementById('card-counter');

        function updateCard(index) {
            cards.forEach((card, i) => {
                card.classList.remove('active', 'prev');
                if (i === index) {
                    card.classList.add('active');
                } else if (i < index) {
                    card.classList.add('prev');
                }
            });

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            counter.textContent = (index + 1) + ' / 3';
        }

        function goToCard(index) {
            if (index < 0 || index >= cards.length) return;
            currentCard = index;
            updateCard(index);
        }

        wrapper.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
        });

        wrapper.addEventListener('mousemove', () => {
            wrapper.style.cursor = isDragging ? 'grabbing' : 'grab';
        });

        wrapper.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            const diff = startX - e.clientX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToCard(currentCard + 1);
                } else {
                    goToCard(currentCard - 1);
                }
            }
            isDragging = false;
        });

        wrapper.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        wrapper.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            const diff = startX - e.changedTouches[0].clientX;

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToCard(currentCard + 1);
                } else {
                    goToCard(currentCard - 1);
                }
            }
            isDragging = false;
        });

        dots.forEach((dot) => {
            dot.addEventListener('click', () => {
                goToCard(parseInt(dot.dataset.index));
            });
        });
    </script>
</body>
</html>
